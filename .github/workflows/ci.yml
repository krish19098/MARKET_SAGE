name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: ms, POSTGRES_PASSWORD: ms, POSTGRES_DB: ms}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ms" --health-interval 5s --health-retries 10
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv run pytest
        env: {MARKET_SAGE_TEST_DATABASE_URL: "postgresql+psycopg://ms:ms@localhost:5432/ms"}
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
