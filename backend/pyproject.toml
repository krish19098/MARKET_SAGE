[project]
name = "market-sage"
version = "0.1.0"
description = "MARKET SAGE — evidence-driven Indian equity research and swing-trading decision support (advisory + paper trading only)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pandas>=2.2",
  "numpy>=2.0",
  "pyarrow>=17",
  "scikit-learn>=1.5",
  "httpx>=0.27",
  "websockets>=13",
  "pyotp>=2.9",
  "apscheduler>=3.10,<4",
  "pywebpush>=2.0",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
]

[project.scripts]
market-sage = "market_sage.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_sage"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ"]
ignore = ["S101", "B008", "S311", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["postgres: requires MARKET_SAGE_TEST_DATABASE_URL pointing to PostgreSQL"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
